---
- name: Fetch PPA signing key fingerprint from Launchpad API
  ansible.builtin.uri:
    url: "{{ public_repo_ppa_api_url }}"
    return_content: true
    method: GET
    headers:
      Accept: "application/json"
  register: _launchpad_response
  until: _launchpad_response is succeeded
  retries: 3
  delay: 10

- name: Install python3-debian for deb822 repository management (APT)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
  register: _public_repo_python_debian
  until: _public_repo_python_debian is succeeded
  retries: 3

- name: Add LINBIT drbd9-stack PPA
  ansible.builtin.deb822_repository:
    name: linbit-drbd9-stack
    types: [deb]
    uris: "{{ public_repo_ppa_url }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ _launchpad_response.json.signing_key_fingerprint }}"
  notify: refresh_apt_cache

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
