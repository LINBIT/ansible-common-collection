# SPDX-License-Identifier: MIT
---
# update_cache: fresh images ship without package lists
- name: Install gpg for repository management (APT)
  ansible.builtin.apt:
    name: gpg
    state: present
    update_cache: true
  register: _zfs_install_gpg
  until: _zfs_install_gpg is succeeded
  retries: 3
  delay: 10

- name: Enable Debian contrib repository for ZFS
  ansible.builtin.deb822_repository:
    name: debian-contrib
    uris: http://deb.debian.org/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: contrib
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
  register: _zfs_install_contrib_repo

- name: Enable Debian backports repository for ZFS
  ansible.builtin.deb822_repository:
    name: debian-backports
    uris: http://deb.debian.org/debian
    suites: "{{ ansible_facts['distribution_release'] }}-backports"
    components: contrib
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
  register: _zfs_install_backports_repo

- name: Update apt cache after enabling repos  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when:
    - _zfs_install_contrib_repo is changed
      or _zfs_install_backports_repo is changed
  register: _zfs_install_apt_update
  until: _zfs_install_apt_update is succeeded
  retries: 3
  delay: 10

- name: Install kernel headers for ZFS DKMS
  ansible.builtin.package:
    name: "{{ ansible_facts | linbit.common.dkms_kernel_headers }}"
    state: present
  register: _zfs_install_kernel_headers
  until: _zfs_install_kernel_headers is succeeded
  retries: 3
  delay: 10

- name: Install ZFS packages (APT)
  ansible.builtin.apt:
    name:
      - zfsutils-linux
      - zfs-dkms
    state: present
    default_release: "{{ ansible_facts['distribution_release'] }}-backports"
  register: _zfs_install_zfs_apt
  until: _zfs_install_zfs_apt is succeeded
  retries: 3
  delay: 10
