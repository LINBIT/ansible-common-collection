---
# defaults file for customer_repo
customer_repo_force_register: false

customer_repo_el_minor: false

# Glob patterns to filter repo names returned by the API.
# included: only repos matching at least one pattern are configured (empty = all).
# excluded: repos matching any pattern are excluded (applied after included).
customer_repo_includes: []

# Default repo exclusions shipped by the collection.
customer_repo_default_excludes:
  - 'drbd-8*'
  - 'drbd-9.0*'
  - 'pacemaker-3'  # empty repo, remove when populated

# User-defined repo exclusions, merged with default_excludes.
customer_repo_user_excludes: []

# Combined excludes used by templates. Do not set directly.
_customer_repo_excludes: "{{ customer_repo_default_excludes + customer_repo_user_excludes }}"

# Enable staging package URLs for repos matching customer_repo_staging_repos.
customer_repo_staging: false
customer_repo_staging_repos:
  - 'drbd-9*'
