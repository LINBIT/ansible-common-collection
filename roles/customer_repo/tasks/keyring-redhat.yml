# SPDX-License-Identifier: MIT
---
- name: Ensure gnupg2 is installed (required by rpm_key)
  ansible.builtin.dnf:
    name: gnupg2
    state: present

- name: Install LINBIT GPG keyring (DNF)  # noqa: package-latest
  ansible.builtin.dnf:
    name: "https://packages.linbit.com/public/linbit-keyring/{{ _linbit_distribution }}/linbit-keyring.rpm"
    state: latest
    disable_gpg_check: true

- name: Import LINBIT GPG key into RPM database
  ansible.builtin.rpm_key:
    state: present
    key: /etc/pki/rpm-gpg/RPM-GPG-KEY-linbit
