---
- name: Gather facts
  ansible.builtin.setup:
    gather_subset: min
  when: ansible_facts['os_family'] is not defined

- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts['distribution'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true

- name: Check if LINBIT repo is configured
  ansible.builtin.stat:
    path: "{{ customer_repo_file }}"
  register: _customer_repo_check

- name: Configure LINBIT customer repository
  ansible.builtin.include_tasks: configure-repo.yml
  when: not _customer_repo_check.stat.exists or customer_repo_force_register | bool
