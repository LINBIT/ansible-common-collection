---
- name: Check if LINBIT node is already registered
  ansible.builtin.stat:
    path: /var/lib/drbd-support/registration.json
  when: not customer_repo_force_register
  register: _customer_repo_registration_cache

- name: Configure LINBIT customer repository
  ansible.builtin.include_tasks: configure-repo.yml
  when: >-
    customer_repo_force_register | bool or
    not _customer_repo_registration_cache.stat.exists

- name: Install DRBD Proxy license
  ansible.builtin.include_tasks: install-proxy-license.yml
  when:
    - customer_repo_install_proxy_license | bool
    - linbit_cluster_id is defined
    - linbit_cluster_id | string | length > 0
