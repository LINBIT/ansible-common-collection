# SPDX-License-Identifier: MIT
---
- name: Ensure gpg2 is installed (required by rpm_key)
  community.general.zypper:
    name: gpg2
    state: present
  register: _linbit_gpg2_install
  until: _linbit_gpg2_install is succeeded
  retries: 3
  delay: 10

- name: Install LINBIT GPG keyring (Zypper)
  community.general.zypper:
    name: "https://packages.linbit.com/public/linbit-keyring/{{ _linbit_distribution }}/linbit-keyring.rpm"
    state: latest
    disable_gpg_check: true
  register: _linbit_keyring_install
  until: _linbit_keyring_install is succeeded
  retries: 3
  delay: 10

- name: Import LINBIT GPG key into RPM database
  ansible.builtin.rpm_key:
    state: present
    key: /etc/pki/rpm-gpg/RPM-GPG-KEY-linbit
