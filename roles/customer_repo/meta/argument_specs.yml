# SPDX-License-Identifier: MIT
---
argument_specs:
  main:
    short_description: Register nodes with the LINBIT customer portal
    description:
      - Register nodes with the LINBIT customer portal and configure LINBIT package repositories.
      - Uses the C(linbit.common.linbit_register_node) module to authenticate against the LINBIT customer portal API.
      - Registration data is cached in C(/var/lib/drbd-support/registration.json) for idempotency.
    options:
      linbit_username:
        type: str
        required: true
        description:
          - LINBIT portal username.
          - Prompted interactively if undefined or empty.
      linbit_password:
        type: str
        required: true
        no_log: true
        description:
          - LINBIT portal password.
          - Prompted interactively if undefined or empty.
      linbit_contract_id:
        type: str
        description:
          - Contract ID.
          - Auto-discovered from the newest (highest ID) active contract on the account.
      linbit_cluster_id:
        type: str
        description:
          - Cluster ID.
          - Auto-discovered from existing registration, most recent cluster, or a new cluster is created.
      customer_repo_force_register:
        type: bool
        default: false
        description:
          - Force re-registration even if the node is already registered.
      customer_repo_el_minor:
        type: bool
        default: false
        description:
          - Pin Enterprise Linux repo URLs to the specific minor version (for example C(9.3)) rather than the major stream.
      customer_repo_includes:
        type: list
        elements: str
        default: []
        description:
          - List of glob patterns (anchored) to filter which repos are enabled in the production repo file.
          - Only repos matching at least one pattern are enabled.
          - Empty list enables all repos.
      customer_repo_default_excludes:
        type: list
        elements: str
        default: ['drbd-8*', 'drbd-9.0*', 'pacemaker-3']
        description:
          - Default repo exclusion patterns (anchored) shipped by the collection.
          - Applied to the production repo file only.
          - Override to C([]) to disable default exclusions.
      customer_repo_user_excludes:
        type: list
        elements: str
        default: []
        description:
          - User-defined repo exclusion patterns (anchored), merged with C(customer_repo_default_excludes).
          - Applied to the production repo file only.
      customer_repo_staging:
        type: bool
        default: false
        description:
          - >-
            Additionally write a second repo file (C(linbit-staging.repo)
            on RPM, C(linbit-staging.list) on APT) containing staging
            versions of repos matching C(customer_repo_staging_repos).
          - The production repo file is left unchanged.
          - >-
            Staging repos are additive and partial, typically shipping
            only a small subset of packages under active testing, not a
            full 1:1 mirror of prod, so the production repo must stay
            enabled for everything else to resolve.
          - Staging sections are suffixed with C(-staging) (RPM only; APT is differentiated by URL).
          - Staging repo files set C(repo_gpgcheck=0) since staging repo metadata is not signed consistently.
      customer_repo_staging_repos:
        type: list
        elements: str
        default:
          - "drbd-9"
        description:
          - List of glob patterns (anchored) authoritative for the staging repo file.
          - Repos matching any pattern are written to the staging file when C(customer_repo_staging) is C(true).
          - >-
            Excludes (C(customer_repo_default_excludes),
            C(customer_repo_user_excludes)) do NOT apply to staging, so
            a repo that is a stub in production (for example
            C(pacemaker-3)) can still be pulled from staging if added here.
