# SPDX-License-Identifier: MIT
---
- name: Gather OS facts for OS-specific vars
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - min
  when: ansible_facts['os_family'] is not defined

- name: Verify the distribution and kernel support VDO
  ansible.builtin.assert:
    that:
      - _vdo_install_supported
      - _vdo_install_in_tree or _vdo_install_kvdo
    fail_msg: >-
      VDO is not supported on {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }} with kernel {{ ansible_facts['kernel'] }}.
      The role supports Enterprise Linux 9 and newer except Oracle Linux 9,
      Debian 13 and newer (including Proxmox VE 9), and Ubuntu 25.04 and newer,
      on Linux 6.9 or newer or the Enterprise Linux 9 kernel with kmod-kvdo.
    quiet: true

- name: Install VDO packages (Debian)
  ansible.builtin.include_tasks: install-debian.yml
  when: ansible_facts['os_family'] | lower == 'debian'

- name: Install VDO packages (UEK kernel)
  ansible.builtin.include_tasks: install-uek.yml
  when:
    - ansible_facts['os_family'] | lower == 'redhat'
    - ansible_facts | linbit.common.is_uek

- name: Install VDO packages (RedHat)
  ansible.builtin.include_tasks: install-redhat.yml
  when:
    - ansible_facts['os_family'] | lower == 'redhat'
    - not (ansible_facts | linbit.common.is_uek)

- name: Check for the VDO kernel module
  ansible.builtin.command:
    cmd: modinfo {{ _vdo_install_module }}
  register: _vdo_install_module_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Halt if the VDO kernel module is missing
  ansible.builtin.fail:
    msg: >-
      The {{ _vdo_install_module }} kernel module is not available for kernel
      {{ ansible_facts['kernel'] }} on {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}.
  when:
    - _vdo_install_module_check.rc != 0
    - not (ansible_check_mode and _vdo_install_packages is changed)

- name: Load the VDO kernel module and persist it across reboots
  community.general.modprobe:
    name: "{{ _vdo_install_module }}"
    state: present
    persistent: present
  when: not (ansible_check_mode and _vdo_install_packages is changed)
